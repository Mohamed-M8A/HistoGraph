<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histograph | Unit Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
    <div class="logo">HISTOGRAPH</div>
    <div class="header-controls">
        <button type="button" id="themeToggle" onclick="toggleTheme()">DARK</button>
        <button type="button" class="secondary" onclick="promptLibrary()">UPLOAD LIBRARY</button>
        <button type="button" class="secondary" onclick="openAssetModal()">VIEW LIBRARY <span id="assetCount">(0)</span></button>
        <input type="file" id="inLibraryFolder" multiple style="display:none" onchange="handleLibraryUpload(event)">
    </div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <details open>
            <summary>UNIT DESIGNER</summary>
            <div class="details-body">
                <div class="control-group dual-row">
                    <div class="input-half">
                        <label>Hierarchy</label>
                        <select id="inHierarchy" onchange="draw()">
                            <option value="">None</option>
                            <option value="•">•</option>
                            <option value="••">••</option>
                            <option value="•••">•••</option>
                            <option value="I">I</option>
                            <option value="II">II</option>
                            <option value="III">III</option>
                            <option value="X">X</option>
                            <option value="XX">XX</option>
                            <option value="XXX">XXX</option>
                            <option value="XXXX">XXXX</option>
                            <option value="XXXXX">XXXXX</option>
                        </select>
                    </div>
                    <div class="input-half">
                        <label>Position</label>
                        <div class="toggle-row" id="positionToggle">
                            <button type="button" class="toggle-btn active" data-pos="inside" onclick="setPosition('inside')">IN</button>
                            <button type="button" class="toggle-btn" data-pos="outside" onclick="setPosition('outside')">OUT</button>
                        </div>
                    </div>
                </div>

                <div class="control-group dual-row">
                    <div class="input-half">
                        <label>Unit Label</label>
                        <input type="text" id="inNumber" placeholder="1st Infantry Div" oninput="draw()">
                    </div>
                    <div class="input-half">
                        <label>Position</label>
                        <div class="toggle-row" id="labelPositionToggle">
                            <button type="button" class="toggle-btn active" data-labelpos="inside" onclick="setLabelPosition('inside')">IN</button>
                            <button type="button" class="toggle-btn" data-labelpos="outside" onclick="setLabelPosition('outside')">OUT</button>
                        </div>
                    </div>
                </div>

                <div class="control-group">
                    <label>Shape & Colors</label>
                    <div class="shape-color-row">
                        <div class="toggle-row flex-grow" id="shapeToggle">
                            <button type="button" class="toggle-btn active" data-shape="shape-square" onclick="setShape('shape-square')">■</button>
                            <button type="button" class="toggle-btn" data-shape="shape-rounded" onclick="setShape('shape-rounded')">▢</button>
                            <button type="button" class="toggle-btn" data-shape="shape-circle" onclick="setShape('shape-circle')">●</button>
                            <button type="button" class="toggle-btn" data-shape="shape-hexagon" onclick="setShape('shape-hexagon')">⬢</button>
                        </div>
                        <div class="color-pickers">
                            <input type="color" id="inColor" value="#ffffff" title="Base Color" oninput="draw()">
                            <input type="color" id="inStrokeColor" value="#000000" title="Stroke Color" oninput="draw()">
                            <input type="color" id="inTextColor" value="#000000" title="Text Color" oninput="draw()">
                        </div>
                    </div>
                </div>

                <details class="nested-details" id="imageDetails" ontoggle="savePrefs()">
                    <summary>Background Image</summary>
                    <div class="control-group">
                        <input type="file" id="inImage" accept="image/*,.svg" onchange="handleImage(event)" style="display:none">
                        <label for="inImage" class="file-btn">Choose File</label>
                    </div>
                    <div class="control-group">
                        <label>Opacity</label>
                        <div class="slider-group">
                            <input type="range" id="inOpacity" min="0" max="1" step="0.1" value="0.5" oninput="draw()">
                            <span id="opacityVal">0.5</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Zoom</label>
                        <div class="slider-group">
                            <input type="range" id="inImgZoom" min="1" max="3" step="0.05" value="1" oninput="draw()">
                            <span id="imgZoomVal">1.00x</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Position X</label>
                        <div class="slider-group">
                            <input type="range" id="inImgOffsetX" min="-100" max="100" step="1" value="0" oninput="draw()">
                            <span id="imgOffsetXVal">X:0</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Position Y</label>
                        <div class="slider-group">
                            <input type="range" id="inImgOffsetY" min="-100" max="100" step="1" value="0" oninput="draw()">
                            <span id="imgOffsetYVal">Y:0</span>
                        </div>
                    </div>
                </details>

                <details class="nested-details" id="fontDetails" ontoggle="savePrefs()">
                    <summary>Font</summary>
                    <div class="control-group">
                        <label>Font Size</label>
                        <div class="slider-group">
                            <input type="range" id="inFontSize" min="8" max="100" step="1" value="35" oninput="setFontSize(this.value)">
                            <span id="fontSizeVal">35px</span>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Font Family</label>
                        <div class="font-grid">
                            <button type="button" class="font-btn active" data-font="Arial" style="font-family:Arial" onclick="setFontFamily('Arial')">Arial</button>
                            <button type="button" class="font-btn" data-font="Tahoma" style="font-family:Tahoma" onclick="setFontFamily('Tahoma')">Tahoma</button>
                            <button type="button" class="font-btn" data-font="Verdana" style="font-family:Verdana" onclick="setFontFamily('Verdana')">Verdana</button>
                            <button type="button" class="font-btn" data-font="Georgia" style="font-family:Georgia" onclick="setFontFamily('Georgia')">Georgia</button>
                            <button type="button" class="font-btn" data-font="'Times New Roman', serif" style="font-family:'Times New Roman'" onclick="setFontFamily('\'Times New Roman\', serif')">Times</button>
                            <button type="button" class="font-btn" data-font="'Courier New', monospace" style="font-family:'Courier New'" onclick="setFontFamily('\'Courier New\', monospace')">Courier</button>
                        </div>
                    </div>
                </details>

                <div class="control-group">
                    <label>Format</label>
                    <div class="toggle-row" id="formatToggle">
                        <button type="button" class="toggle-btn active" data-format="png" onclick="setFormat('png')">PNG</button>
                        <button type="button" class="toggle-btn" data-format="svg" onclick="setFormat('svg')">SVG</button>
                    </div>
                </div>

                <button onclick="downloadToken()">DOWNLOAD</button>
                <button class="secondary" onclick="saveToGallery()">SAVE TO GALLERY</button>
            </div>
        </details>

        <details>
            <summary>MASS PRODUCTION</summary>
            <div class="details-body">
                <div class="control-group">
                    <textarea id="inBatchText" rows="6" placeholder="Syntax: country;hierarchy;shape;stroke;text;bg;opacity;font;size;label;zoom;offX;offY;count"></textarea>
                </div>
                <div class="control-group">
                    <input type="file" id="inBatchFile" accept=".txt,.csv" onchange="handleBatchFileUpload(event)" style="display:none">
                    <label for="inBatchFile" class="file-btn secondary">Upload Script</label>
                </div>
                <div class="control-group">
                    <input type="text" id="inMassPrefix" placeholder="Filename Prefix">
                </div>
                <button type="button" onclick="runMassProduction()">GENERATE BATCH ZIP</button>
                <div id="massReport"></div>
            </div>
        </details>
    </div>

    <div class="preview-pane">
        <div class="preview-sticky-wrap">
            <div id="token-container">
                <div id="hierarchyOutside"></div>
                <div id="mainShape" class="main-shape shape-square">
                    <div id="bgLayer" class="bg-image-layer"></div>
                    <svg id="hexOutline" viewBox="0 0 250 250"><polygon points="62.5,0 187.5,0 250,125 187.5,250 62.5,250 0,125" fill="none" stroke="#000" stroke-width="8" /></svg>
                    <div id="hierarchyInside"></div>
                    <div id="nameDisplay" class="unit-label"></div>
                </div>
                <div id="nameDisplayOutside" class="unit-label-outside"></div>
            </div>
            <p class="branding-text">Histograph | Visual Engine</p>

            <div id="gallery-wrap">
                <div id="gallery-title">SESSION GALLERY</div>
                <div class="gallery-controls">
                    <input type="text" id="inBatchPrefix" placeholder="ZIP Prefix">
                    <button type="button" class="secondary" onclick="downloadAllZip()">ZIP ALL</button>
                </div>
                <div id="gallery-strip"><span id="gallery-empty">Empty</span></div>
            </div>
        </div>
    </div>
</div>

<div id="assetModal" class="modal" onclick="closeAssetModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>Loaded Library Assets</h3>
            <span class="close-modal" onclick="closeAssetModal(event)">&times;</span>
        </div>
        <div id="assetGrid" class="asset-grid"></div>
    </div>
</div>

<div id="lightbox" onclick="closeLightbox(event)">
    <button id="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <img id="lightbox-img" src="">
</div>

<canvas id="canvas-hidden" width="500" height="500"></canvas>

<script src="js/zip.js"></script>
<script src="js/state.js"></script>
<script src="js/render-engine.js"></script>
<script src="js/assets.js"></script>
<script src="js/gallery.js"></script>
<script src="js/mass-production.js"></script>
<script src="js/ui-controls.js"></script>

</body>
</html>
