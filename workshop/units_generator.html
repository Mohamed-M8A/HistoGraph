<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f;
  --panel:#12151a;
  --panel-alt:#171b21;
  --border:#262b32;
  --border-strong:#3a4049;
  --text:#e8eaed;
  --text-dim:#8b929c;
  --text-faint:#565c66;
  --accent:#c98a3e;
  --accent-dim:#7a5528;
  --danger:#c4453a;
  --ok:#5f9b6f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;
  line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',monospace}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--text-faint);
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
  padding:18px 28px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}
.title-block{display:flex;align-items:baseline;gap:12px}
.title-block h1{
  font-size:15px;
  font-weight:600;
  letter-spacing:0.02em;
}
.context-strip{
  display:flex;
  gap:0;
  border:1px solid var(--border);
}
.context-field{
  display:flex;
  flex-direction:column;
  gap:3px;
  padding:8px 16px;
  border-right:1px solid var(--border);
  min-width:120px;
}
.context-field:last-child{border-right:none}
.context-field label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--text-faint);
}
.context-field input,.context-field select{
  background:transparent;
  border:none;
  color:var(--accent);
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  font-weight:500;
  outline:none;
}
.readout{
  display:flex;
  gap:24px;
  font-family:'IBM Plex Mono',monospace;
}
.readout-item{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.readout-item .value{font-size:20px;font-weight:600;color:var(--text)}
.readout-item .label{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint)}
main{
  display:grid;
  grid-template-columns:1fr 420px;
  gap:1px;
  background:var(--border);
  min-height:calc(100vh - 73px);
}
.pane{background:var(--bg);padding:24px 28px;overflow-y:auto}
.pane-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:1px solid var(--border);
}
.pane-header h2{font-size:13px;font-weight:600;letter-spacing:0.04em}
.btn{
  background:var(--panel-alt);
  border:1px solid var(--border-strong);
  color:var(--text);
  padding:7px 14px;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:border-color .15s, color .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{border-color:var(--accent-dim);color:var(--accent)}
.btn-primary:hover{border-color:var(--accent);background:rgba(201,138,62,0.08)}
.btn-danger{color:var(--danger);border-color:var(--border-strong)}
.btn-danger:hover{border-color:var(--danger)}
.btn-row{display:flex;gap:8px}
.unit-block{
  position:relative;
  border:1px solid var(--border);
  background:var(--panel);
  padding:20px;
  margin-bottom:20px;
}
.unit-block::before,.unit-block::after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-color:var(--border-strong);
}
.unit-block::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
.unit-block::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}
.unit-block-header{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
  margin-bottom:16px;
  padding-bottom:16px;
  border-bottom:1px dashed var(--border);
}
.field{display:flex;flex-direction:column;gap:5px}
.field label{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-faint);
}
input[type="text"],input[type="number"],select{
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:7px 10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  outline:none;
  width:100%;
}
input:focus,select:focus{border-color:var(--accent)}
.unit-summary{display:flex;gap:16px;margin-bottom:16px}
.badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:5px 10px;
}
.badge .n{color:var(--accent);font-weight:600}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin:16px 0 8px;
}
table{width:100%;border-collapse:collapse;margin-bottom:4px}
th,td{
  padding:7px 6px;
  text-align:left;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
th{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--text-faint);
  font-weight:400;
}
td input{padding:5px 8px;font-size:12px}
.icon-btn{
  background:none;
  border:1px solid var(--border);
  color:var(--text-faint);
  width:26px;
  height:26px;
  cursor:pointer;
  font-family:'IBM Plex Mono',monospace;
}
.icon-btn:hover{border-color:var(--danger);color:var(--danger)}
.remove-unit{position:absolute;top:16px;right:16px}
.json-output{
  position:sticky;
  top:24px;
  background:var(--panel);
  border:1px solid var(--border);
}
.json-body{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--accent);
  padding:16px;
  max-height:70vh;
  overflow-y:auto;
  white-space:pre-wrap;
  word-break:break-word;
}
.json-actions{
  display:flex;
  gap:8px;
  padding:14px 16px;
  border-top:1px solid var(--border);
}
.json-actions .btn{flex:1}
.import-label{
  display:inline-flex;
  align-items:center;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>ROSTER GENERATOR</h1>
    <span class="eyebrow">Order of Battle / Data Entry</span>
  </div>

  <div class="context-strip">
    <div class="context-field">
      <label>Country</label>
      <input type="text" id="contextCountry" value="egypt" onchange="renderJSON()">
    </div>
    <div class="context-field">
      <label>Era</label>
      <input type="text" id="contextEra" value="modern" onchange="renderJSON()">
    </div>
    <div class="context-field">
      <label>File</label>
      <select id="contextFileType" onchange="renderJSON()">
        <option value="land.json">land.json</option>
        <option value="armor.json">armor.json</option>
        <option value="naval.json">naval.json</option>
        <option value="air.json">air.json</option>
      </select>
    </div>
  </div>

  <div class="readout">
    <div class="readout-item">
      <span class="value" id="readoutPersonnel">0</span>
      <span class="label">Personnel</span>
    </div>
    <div class="readout-item">
      <span class="value" id="readoutVehicles">0</span>
      <span class="label">Vehicles</span>
    </div>
    <div class="readout-item">
      <span class="value" id="readoutUnits">0</span>
      <span class="label">Units</span>
    </div>
  </div>
</header>

<main>
  <div class="pane">
    <div class="pane-header">
      <h2>UNIT DEFINITIONS</h2>
      <div class="btn-row">
        <label class="btn import-label">
          IMPORT
          <input type="file" id="importJsonInput" accept=".json" style="display:none" onchange="importJSON(event)">
        </label>
        <button class="btn btn-primary" onclick="addUnitBlock()">+ ADD UNIT</button>
      </div>
    </div>
    <div id="unitsContainer"></div>
  </div>

  <div class="pane">
    <div class="json-output">
      <div class="pane-header" style="margin:0;padding:14px 16px;border-bottom:1px solid var(--border)">
        <h2>OUTPUT</h2>
      </div>
      <div class="json-body mono" id="jsonPreview">{}</div>
      <div class="json-actions">
        <button class="btn" onclick="copyJSON()">COPY</button>
        <button class="btn btn-primary" onclick="downloadJSON()">DOWNLOAD</button>
      </div>
    </div>
  </div>
</main>

<datalist id="weaponOptions">
  <option value="AK-47">
  <option value="M4A1">
  <option value="RPG-7">
  <option value="PKM">
  <option value="T-90_Cannon">
  <option value="120mm_Mortar">
  <option value="Sniper_SVD">
</datalist>

<script>
let unitsData = [
  {
    id: "INFANTRY",
    icon: "assets/infantry.svg",
    parentUnit: "",
    soldiers: [
      { type: "rifleman", count: 8, healthPerUnit: 100, weapon: "AK-47", speed: 5 },
      { type: "commander", count: 1, healthPerUnit: 120, weapon: "AK-47", speed: 5 }
    ],
    vehicles: []
  }
];

function renderUnits() {
  const container = document.getElementById('unitsContainer');
  container.innerHTML = '';

  let grandPersonnel = 0;
  let grandVehicles = 0;

  unitsData.forEach((unit, unitIdx) => {
    const unitBlock = document.createElement('div');
    unitBlock.className = 'unit-block';

    let totalFleshHP = 0;
    let totalSoldiersCount = 0;
    unit.soldiers.forEach(s => {
      totalFleshHP += (s.count * s.healthPerUnit);
      totalSoldiersCount += s.count;
    });

    let totalMetalHP = 0;
    let totalVehiclesCount = 0;
    unit.vehicles.forEach(v => {
      totalMetalHP += (v.count * v.healthPerUnit);
      totalVehiclesCount += v.count;
    });

    grandPersonnel += totalSoldiersCount;
    grandVehicles += totalVehiclesCount;

    unitBlock.innerHTML = `
      <button class="btn btn-danger remove-unit" onclick="removeUnit(${unitIdx})">DELETE</button>

      <div class="unit-block-header">
        <div class="field">
          <label>Unit ID</label>
          <input type="text" value="${unit.id}" onchange="updateUnitKey(${unitIdx}, 'id', this.value)">
        </div>
        <div class="field">
          <label>Icon Path</label>
          <input type="text" value="${unit.icon || ''}" placeholder="assets/infantry.svg" onchange="updateUnitKey(${unitIdx}, 'icon', this.value)">
        </div>
        <div class="field">
          <label>Parent Unit</label>
          <input type="text" value="${unit.parentUnit || ''}" placeholder="BRIGADE_HQ" onchange="updateUnitKey(${unitIdx}, 'parentUnit', this.value)">
        </div>
      </div>

      <div class="unit-summary">
        <span class="badge">PERSONNEL <span class="n">${totalSoldiersCount}</span> &middot; ${totalFleshHP} HP</span>
        <span class="badge">VEHICLES <span class="n">${totalVehiclesCount}</span> &middot; ${totalMetalHP} HP</span>
      </div>

      <div class="section-title">
        <span>Soldiers</span>
        <button class="btn" onclick="addSoldier(${unitIdx})">+ ADD</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Count</th>
            <th>HP</th>
            <th>Weapon</th>
            <th>Speed</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${unit.soldiers.map((s, sIdx) => `
            <tr>
              <td><input type="text" value="${s.type}" onchange="updateSoldier(${unitIdx}, ${sIdx}, 'type', this.value)"></td>
              <td><input type="number" value="${s.count}" min="1" style="width:64px" onchange="updateSoldier(${unitIdx}, ${sIdx}, 'count', parseInt(this.value)||0)"></td>
              <td><input type="number" value="${s.healthPerUnit}" min="1" style="width:72px" onchange="updateSoldier(${unitIdx}, ${sIdx}, 'healthPerUnit', parseInt(this.value)||0)"></td>
              <td><input type="text" list="weaponOptions" value="${s.weapon}" onchange="updateSoldier(${unitIdx}, ${sIdx}, 'weapon', this.value)"></td>
              <td><input type="number" value="${s.speed || 5}" min="1" style="width:64px" onchange="updateSoldier(${unitIdx}, ${sIdx}, 'speed', parseInt(this.value)||0)"></td>
              <td><button class="icon-btn" onclick="removeSoldier(${unitIdx}, ${sIdx})">X</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>

      <div class="section-title">
        <span>Vehicles</span>
        <button class="btn" onclick="addVehicle(${unitIdx})">+ ADD</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>Count</th>
            <th>HP</th>
            <th>Weapon</th>
            <th>Speed</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${unit.vehicles.map((v, vIdx) => `
            <tr>
              <td><input type="text" value="${v.type}" onchange="updateVehicle(${unitIdx}, ${vIdx}, 'type', this.value)"></td>
              <td><input type="number" value="${v.count}" min="1" style="width:64px" onchange="updateVehicle(${unitIdx}, ${vIdx}, 'count', parseInt(this.value)||0)"></td>
              <td><input type="number" value="${v.healthPerUnit}" min="1" style="width:72px" onchange="updateVehicle(${unitIdx}, ${vIdx}, 'healthPerUnit', parseInt(this.value)||0)"></td>
              <td><input type="text" list="weaponOptions" value="${v.weapon}" onchange="updateVehicle(${unitIdx}, ${vIdx}, 'weapon', this.value)"></td>
              <td><input type="number" value="${v.speed || 40}" min="1" style="width:64px" onchange="updateVehicle(${unitIdx}, ${vIdx}, 'speed', parseInt(this.value)||0)"></td>
              <td><button class="icon-btn" onclick="removeVehicle(${unitIdx}, ${vIdx})">X</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
    container.appendChild(unitBlock);
  });

  document.getElementById('readoutPersonnel').textContent = grandPersonnel;
  document.getElementById('readoutVehicles').textContent = grandVehicles;
  document.getElementById('readoutUnits').textContent = unitsData.length;

  renderJSON();
}

function addUnitBlock() {
  unitsData.push({
    id: "NEW_UNIT_" + (unitsData.length + 1),
    icon: "assets/unit.svg",
    parentUnit: "",
    soldiers: [],
    vehicles: []
  });
  renderUnits();
}

function removeUnit(idx) {
  unitsData.splice(idx, 1);
  renderUnits();
}

function updateUnitKey(idx, key, val) {
  unitsData[idx][key] = val;
  renderJSON();
}

function addSoldier(unitIdx) {
  unitsData[unitIdx].soldiers.push({ type: "rifleman", count: 1, healthPerUnit: 100, weapon: "AK-47", speed: 5 });
  renderUnits();
}

function removeSoldier(unitIdx, sIdx) {
  unitsData[unitIdx].soldiers.splice(sIdx, 1);
  renderUnits();
}

function updateSoldier(unitIdx, sIdx, field, val) {
  unitsData[unitIdx].soldiers[sIdx][field] = val;
  renderUnits();
}

function addVehicle(unitIdx) {
  unitsData[unitIdx].vehicles.push({ type: "bmp_1", count: 1, healthPerUnit: 500, weapon: "73mm_Grom", speed: 45 });
  renderUnits();
}

function removeVehicle(unitIdx, vIdx) {
  unitsData[unitIdx].vehicles.splice(vIdx, 1);
  renderUnits();
}

function updateVehicle(unitIdx, vIdx, field, val) {
  unitsData[unitIdx].vehicles[vIdx][field] = val;
  renderUnits();
}

function renderJSON() {
  const country = document.getElementById('contextCountry').value.trim() || 'egypt';
  const era = document.getElementById('contextEra').value.trim() || 'modern';

  const jsonOutput = {
    _meta: {
      country: country,
      era: era,
      assetPath: `content/units/${country}/${era}/assets/`
    },
    units: {}
  };

  unitsData.forEach(u => {
    const unitObj = {};
    if (u.icon) unitObj.icon = u.icon;
    if (u.parentUnit) unitObj.parentUnit = u.parentUnit;
    if (u.soldiers && u.soldiers.length > 0) unitObj.soldiers = u.soldiers;
    if (u.vehicles && u.vehicles.length > 0) unitObj.vehicles = u.vehicles;
    jsonOutput.units[u.id] = unitObj;
  });

  document.getElementById('jsonPreview').textContent = JSON.stringify(jsonOutput, null, 2);
}

function downloadJSON() {
  const fileType = document.getElementById('contextFileType').value;
  const text = document.getElementById('jsonPreview').textContent;
  const blob = new Blob([text], { type: "application/json" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileType;
  a.click();
}

function copyJSON() {
  const text = document.getElementById('jsonPreview').textContent;
  navigator.clipboard.writeText(text);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data._meta) {
        if (data._meta.country) document.getElementById('contextCountry').value = data._meta.country;
        if (data._meta.era) document.getElementById('contextEra').value = data._meta.era;
      }

      const rawUnits = data.units || data;
      unitsData = [];

      Object.keys(rawUnits).forEach(key => {
        if (key === '_meta') return;
        const u = rawUnits[key];
        unitsData.push({
          id: key,
          icon: u.icon || '',
          parentUnit: u.parentUnit || '',
          soldiers: u.soldiers || [],
          vehicles: u.vehicles || []
        });
      });

      renderUnits();
    } catch (err) {
      alert("Failed to parse JSON file.");
    }
  };
  reader.readAsText(file);
}

renderUnits();
</script>

</body>
</html>
